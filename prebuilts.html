<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pre-builts | iammrabdbuilds</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        select { background: #222; color: white; border: 1px solid #444; }
    </style>
</head>
<body class="bg-black text-white font-sans">
    <nav class="p-6 border-b border-gray-800 flex justify-between items-center max-w-6xl mx-auto">
        <a href="index.html" class="text-2xl font-black text-blue-500">IAMMRABDBUILDS</a>
        <div class="space-x-6">
            <a href="index.html" class="hover:text-blue-400">Builder</a>
            <a href="prebuilts.html" class="text-blue-400 font-bold underline">Pre-builts</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-10">
        <h2 class="text-4xl font-bold mb-8">Ready-to-Ship Builds</h2>

        <div class="glass rounded-3xl p-8 mb-8" id="build-1">
            <h3 class="text-2xl font-bold mb-2">The 1440p King (Ryzen 5 + 3060 Ti)</h3>
            <p class="text-gray-400 mb-6">Perfect for Valo, Fortnite, and Warzone.</p>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="text-xs uppercase text-blue-400">RAM</label>
                    <select class="w-full p-2 rounded" onchange="updatePrice(1)" id="ram-1">
                        <option value="0" selected>16GB DDR5 (Included) - Minimum Amt</option>
                        <option value="15000">32GB DDR5 (+15k) - Recomended</option>
                        <option value="35000">64GB DDR5 (+35k) - Extreme</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs uppercase text-blue-400">Storage</label>
                    <select class="w-full p-2 rounded" onchange="updatePrice(1)" id="ssd-1">
                        <option value="0" selected>512GB NVMe (Included) - Recomended</option>
                        <option value="8000">1TB NVMe (+8k) - Recomended</option>
                        <option value="18000">2TB NVMe (+18k) - Extreme</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs uppercase text-blue-400">GPU Upgrade</label>
                    <select class="w-full p-2 rounded" onchange="updatePrice(1)" id="gpu-1">
                        <option value="0" selected>tRTX 3060 Ti (Included) </option>
                        <option value="45000">RTX 4070 Super (+45k)</option>
                        <option value="120000">RTX 5070 Ti (+120k)</option>
                    </select>
                </div>
            </div>
            
            <div class="mt-6 flex justify-between items-center border-t border-gray-700 pt-4">
                <div class="text-2xl font-black text-green-400">Total: <span id="price-1">210,000</span> PKR</div>
                <button class="bg-blue-600 px-6 py-3 rounded-xl font-bold hover:bg-blue-700">Order on WhatsApp</button>
            </div>
        </div>

    </main>

    <script>
        function updatePrice(id) {
            let basePrice = 210000; // Base price for build 1
            
            let ram = parseInt(document.getElementById('ram-' + id).value);
            let ssd = parseInt(document.getElementById('ssd-' + id).value);
            let gpu = parseInt(document.getElementById('gpu-' + id).value);
            
            let total = basePrice + ram + ssd + gpu;
            document.getElementById('price-' + id).innerText = total.toLocaleString();
        }
    </script>
</body>
</html>
